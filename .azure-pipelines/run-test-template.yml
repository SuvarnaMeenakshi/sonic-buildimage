parameters:
- name: dut
  type: string
- name: tbname
  type: string
- name: tbtype
  type: string
- name: ptf_name
  type: string
- name: image
  type: string
  default: sonic-vs.img.gz
  values:
  - sonic-vs.img.gz
  - sonic-4asic-vs.img.gz
  - sonic-6asic-vs.img.gz

steps:
- checkout: self
  clean: true
  displayName: 'checkout sonic-mgmt repo'

- task: DownloadPipelineArtifact@2
  inputs:
    artifact: sonic-buildimage.vs
  displayName: "Download sonic-buildimage.vs artifact"

- script: |
    set -x
    sudo mkdir -p /data/sonic-vm/images
    sudo cp -v ../target/${{ parameters.image}} /data/sonic-vm/images/sonic-vs.img.gz
    sudo gzip -fd /data/sonic-vm/images/sonic-vs.img.gz
    username=$(id -un)
    sudo chown -R $username.$username /data/sonic-vm

    pushd /data/sonic-mgmt
    git remote update
    git reset --hard origin/master
    sed -i s/use_own_value/${username}/ ansible/veos_vtb
    echo aaa > ansible/password.txt
    docker exec sonic-mgmt bash -c "pushd /data/sonic-mgmt/ansible;./testbed-cli.sh -d /data/sonic-vm -m $(inventory) -t $(testbed_file) -k ceos refresh-dut ${{ parameters.tbname }} password.txt; ./testbed-cli.sh -m $(inventory) -t $(testbed_file) deploy-mg ${{ parameters.tbname }} veos_vtb password.txt" && sleep 180
  displayName: "Setup testbed"

- script: |
    rm -rf $(Build.ArtifactStagingDirectory)/*
    parent_dir="/data/sonic-mgmt"
    tests="bgp/test_bgp_fact.py \
    snmp/test_snmp_pfc_counters.py \
    snmp/test_snmp_queue.py \
    snmp/test_snmp_loopback.py \
    snmp/test_snmp_default_route.py \
    tacacs/test_rw_user.py \
    tacacs/test_ro_user.py \
    tacacs/test_ro_disk.py \
    tacacs/test_jit_user.py"
    CMD="cd $parent_dir/tests; \
    export ANSIBLE_CONFIG=$parent_dir/ansible ANSIBLE_LIBRARY=$parent_dir/ansible; \
    ./run_tests.sh -c \"$tests\" -d ${{ parameters.dut }} -f $(testbed_file) -i $(inventory) -n ${{ parameters.tbname }} -e --disable_loganalyzer"
    echo $CMD
    docker exec sonic-mgmt bash -c "$CMD"
  displayName: "Run tests"

- script: |
    cp -r /data/sonic-mgmt/tests/logs $(Build.ArtifactStagingDirectory)/
    username=$(id -un)
    sudo chown -R $username.$username $(Build.ArtifactStagingDirectory)
  displayName: "Collect test logs"
  condition: succeededOrFailed()

- publish: $(Build.ArtifactStagingDirectory)/kvmdump
  artifact: sonic-buildimage.kvmtest.${{ parameters.tbtype}}.memdump@$(System.JobAttempt)
  displayName: "Archive sonic kvm memdump"
  condition: failed()

- publish: $(Build.ArtifactStagingDirectory)/logs
  artifact: sonic-buildimage.kvmtest.${{ parameters.tbtype }}.log@$(System.JobAttempt)
  displayName: "Archive sonic kvm logs"
  condition: succeededOrFailed()

- task: PublishTestResults@2
  inputs:
    testResultsFiles: '$(Build.ArtifactStagingDirectory)/logs/**/*.xml'
    testRunTitle: kvmtest.${{ parameters.tbtype }}
  condition: succeededOrFailed()
